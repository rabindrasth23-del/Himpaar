<!--
  Himpaar H Mark — production SVG
  Brand color: #5049EE  rgb(80, 73, 238)
  Sampled from brand/source/himpaar-mark.png
  
  Two shapes: left pillar + swoosh crossbar, right pillar + swoosh crossbar.
  The white diagonal gap between them creates the distinctive H swoosh.
  
  Key coordinates (from pixel analysis, normalized to 0-100):
    Left pillar:  x = 0-32,  full height
    Right pillar: x = 67-100, full height
    Corner radius: ~12 units
    Swoosh center: ~y=50%, crossing from right pillar (y≈28%) to left pillar (y≈62%)
    Swoosh gap width: ~14 units
    
  Total viewBox: 0 0 100 100
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="#5049EE">
  
  <!-- Shape A: Left pillar + swoosh upper crossbar
       Path direction: clockwise
       
       Starts at top-left corner, traces:
       1. Top edge of left pillar (with rounded TL corner)
       2. Right edge of left pillar, straight from y=12 down to y=38
       3. Swoosh: right edge curves rightward from (32,38) to peak at (88,53) 
       4. Swoosh curves back left from (88,53) to (32,68)
       5. Right edge straight from y=68 down to y=88
       6. Bottom edge of left pillar (with rounded BL corner)
       7. Left edge back up to start
  -->
  <path d="
    M 20 0
    L 12 0
    Q 0 0, 0 12
    L 0 88
    Q 0 100, 12 100
    L 20 100
    Q 32 100, 32 88
    L 32 68
    C 32 64, 36 60, 44 57
    C 56 52, 70 47, 80 44
    C 86 42, 88 41, 88 40
    L 88 38
    C 88 36, 84 33, 78 30
    C 68 25, 56 22, 44 19
    C 36 17, 32 14, 32 12
    Z
  " />
  
  <!-- Shape B: Right pillar + swoosh lower crossbar
       Mirror of Shape A, offset by the pillar gap.
       
       Starts at bottom-right corner, traces:
       1. Bottom edge of right pillar (with rounded BR corner)
       2. Left edge of right pillar, straight from y=88 up to y=62
       3. Swoosh: left edge curves leftward from (67,62) to peak at (12,47)
       4. Swoosh curves back right from (12,47) to (67,32)
       5. Left edge straight from y=32 up to y=12
       6. Top edge of right pillar (with rounded TR corner)
       7. Right edge back down to start
  -->
  <path d="
    M 80 100
    L 88 100
    Q 100 100, 100 88
    L 100 12
    Q 100 0, 88 0
    L 80 0
    Q 67 0, 67 12
    L 67 32
    C 67 36, 64 40, 56 43
    C 44 48, 30 53, 20 56
    C 14 58, 12 59, 12 60
    L 12 62
    C 12 64, 16 67, 22 70
    C 32 75, 44 78, 56 81
    C 64 83, 67 86, 67 88
    Z
  " />
</svg>