<!DOCTYPE html>
<html>
<head>
<style>
body { margin: 0; display: flex; gap: 20px; padding: 40px; background: #f5f5f5; font-family: sans-serif; }
.panel { text-align: center; }
.panel img, .panel svg { width: 300px; height: 336px; }
.panel h3 { margin: 10px 0; font-size: 14px; color: #333; }
.overlay { position: relative; }
.overlay img { position: absolute; top: 0; left: 0; }
.overlay svg { position: absolute; top: 0; left: 0; opacity: 0.4; }
</style>
</head>
<body>
  <div class="panel">
    <h3>Original PNG</h3>
    <img src="source/himpaar-mark.png" />
  </div>
  <div class="panel">
    <h3>SVG</h3>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="#5049EE">
      <path d="M 20 0 L 12 0 Q 0 0, 0 12 L 0 88 Q 0 100, 12 100 L 20 100 Q 32 100, 32 88 L 32 68 C 32 64, 36 60, 44 57 C 56 52, 70 47, 80 44 C 86 42, 88 41, 88 40 L 88 38 C 88 36, 84 33, 78 30 C 68 25, 56 22, 44 19 C 36 17, 32 14, 32 12 Z" />
      <path d="M 80 100 L 88 100 Q 100 100, 100 88 L 100 12 Q 100 0, 88 0 L 80 0 Q 67 0, 67 12 L 67 32 C 67 36, 64 40, 56 43 C 44 48, 30 53, 20 56 C 14 58, 12 59, 12 60 L 12 62 C 12 64, 16 67, 22 70 C 32 75, 44 78, 56 81 C 64 83, 67 86, 67 88 Z" />
    </svg>
  </div>
  <div class="panel">
    <h3>Overlay (SVG red at 40% over PNG)</h3>
    <div class="overlay" style="width:300px;height:336px;">
      <img src="source/himpaar-mark.png" style="width:300px;height:336px;" />
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="red" style="width:300px;height:336px;">
        <path d="M 20 0 L 12 0 Q 0 0, 0 12 L 0 88 Q 0 100, 12 100 L 20 100 Q 32 100, 32 88 L 32 68 C 32 64, 36 60, 44 57 C 56 52, 70 47, 80 44 C 86 42, 88 41, 88 40 L 88 38 C 88 36, 84 33, 78 30 C 68 25, 56 22, 44 19 C 36 17, 32 14, 32 12 Z" />
        <path d="M 80 100 L 88 100 Q 100 100, 100 88 L 100 12 Q 100 0, 88 0 L 80 0 Q 67 0, 67 12 L 67 32 C 67 36, 64 40, 56 43 C 44 48, 30 53, 20 56 C 14 58, 12 59, 12 60 L 12 62 C 12 64, 16 67, 22 70 C 32 75, 44 78, 56 81 C 64 83, 67 86, 67 88 Z" />
      </svg>
    </div>
  </div>
</body>
</html>
